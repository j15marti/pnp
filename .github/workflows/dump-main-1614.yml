name: dump-main-1614
on:
  workflow_dispatch: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write unified diff of the FULLPAIR6 main.tex edit
        run: |
          set -euo pipefail
          git fetch --depth=2 origin eadc21439b5877ad580d82dbc2f3d9ca32c24d28
          git diff eadc21439b5877ad580d82dbc2f3d9ca32c24d28^ eadc21439b5877ad580d82dbc2f3d9ca32c24d28 -- main.tex > tmp/dump1614/DIFF.txt
          echo "diff_bytes=$(wc -c < tmp/dump1614/DIFF.txt)"
          git hash-object main.tex | tee tmp/dump1614/BLOB_NOW.txt
          git config user.name "Jeremy Martinez"
          git config user.email "42251772+j15marti@users.noreply.github.com"
          git add tmp/dump1614/DIFF.txt tmp/dump1614/BLOB_NOW.txt
          git commit -m "Temp FULLPAIR6 diff of root main.tex for 16:14 review."
          git push
