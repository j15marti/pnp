name: research-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Research report hygiene
        run: python scripts/check_research_reports.py
      - name: Python syntax check
        run: python -m compileall -q src experiments scripts
      - name: Verify canonical root main.tex
        shell: bash
        run: |
          test -s main.tex
          count="$(find . -type f -name main.tex -not -path './.git/*' | wc -l)"
          test "$count" -eq 1

  living-document:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: living-progress-pdf
          path: main.pdf
