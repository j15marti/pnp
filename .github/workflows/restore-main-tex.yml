name: restore-main-tex
on:
  workflow_dispatch:
  push:
    paths:
      - 'comments/grok/_restore_1212/MANIFEST'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and commit main.tex
        run: |
          set -euo pipefail
          parts_dir=comments/grok/_restore_1212
          out=$(mktemp)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cat "$parts_dir/$f" >> "$out"
          done < "$parts_dir/MANIFEST"
          expected=$(cat "$parts_dir/EXPECTED_LEN")
          actual=$(wc -c < "$out")
          echo "expected=$expected actual=$actual"
          test "$actual" -eq "$expected"
          grep -q "P versus NP remains open" "$out"
          grep -q "Independent review --- 2026-10-02 12:12 PT" "$out"
          grep -q "BEGIN LSPV-1 OWNED" "$out"
          cp "$out" main.tex
          rm -rf comments/grok/_restore_1212
          rm -f .github/workflows/restore-main-tex.yml
          rm -f test_encoding.txt
          git config user.name "Jeremy Martinez"
          git config user.email "42251772+j15marti@users.noreply.github.com"
          git add -A
          git commit -m "Restore full main.tex from 12:12 reconciliation chunks; remove emergency stub"
          git push
